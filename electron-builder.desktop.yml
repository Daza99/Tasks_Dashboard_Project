# Per-user NSIS installer — data default in AppData (not beside the exe)
appId: com.lumo.personal-dashboard
productName: Daybrief
directories:
  output: release/desktop
files:
  - dist/**/*
  - src/main/**/*
  - src/services/**/*
  - src/utils/**/*
  - package.json
  - build/icon.ico
extraResources:
  - from: src/services/db/schema.sql
    to: schema.sql
asarUnpack:
  - node_modules/better-sqlite3/**
  - "**/*.node"
extraMetadata:
  flavor: desktop
afterPack: build/set-exe-icon.js
win:
  icon: build/icon.ico
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Daybrief
  uninstallDisplayName: Daybrief
