<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Reminder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: "Segoe UI", Candara, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .card {
        --notif-bg: #f4f1ea;
        --notif-border: #4a5a6a;
        --notif-text: #111111;
        margin: 4px;
        height: calc(100% - 8px);
        border-radius: 14px;
        background: var(--notif-bg);
        border: 3px solid var(--notif-border);
        /* Transparent Electron windows on Windows often drop CSS border; ring still paints. */
        box-shadow: 0 0 0 3px var(--notif-border), 0 8px 28px rgba(0, 0, 0, 0.45);
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--notif-text);
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
      }
      .chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
        -webkit-app-region: drag;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      .chrome-btns {
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }
      .chrome-btns button {
        width: 28px;
        height: 24px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid var(--notif-border);
        background: rgba(255, 255, 255, 0.55);
        color: var(--notif-text);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }
      .chrome-btns button.close:hover {
        background: rgba(255, 92, 92, 0.35);
        border-color: rgba(255, 92, 92, 0.8);
        color: var(--notif-text);
      }
      .title {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        overflow: hidden;
      }
      .created {
        flex: 0 0 auto;
        font-size: 11px;
        opacity: 0.65;
        color: var(--notif-text);
        margin-top: -4px;
      }
      .created:empty {
        display: none;
      }
      .notif-tags {
        flex: 0 0 auto;
        font-size: 12px;
        letter-spacing: 0.02em;
        opacity: 0.72;
        color: var(--notif-text);
        margin-top: -4px;
      }
      .notif-tags:empty {
        display: none;
      }
      .details {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        color: var(--notif-text);
        -webkit-app-region: no-drag;
      }
      .details:empty {
        display: none;
      }
      .details::-webkit-scrollbar {
        width: 5px;
      }
      .details::-webkit-scrollbar-track {
        background: transparent;
      }
      .details::-webkit-scrollbar-thumb {
        background: var(--notif-border);
        border-radius: 4px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        flex: 0 0 auto;
      }
      .actions button {
        border-radius: 8px;
        border: 1px solid var(--notif-border);
        background: rgba(255, 255, 255, 0.45);
        color: var(--notif-text);
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .actions button.secondary {
        border-color: var(--notif-border);
        background: transparent;
        color: var(--notif-text);
      }
      /* Solid white / #111 — same contrast shell as .confirm-dialog */
      .snooze-plus-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 14px 14px 12px;
        background: #fff;
        color: #111;
        color-scheme: light;
        border-radius: 11px;
        -webkit-app-region: no-drag;
      }
      .snooze-plus-overlay[hidden] {
        display: none !important;
      }
      .snooze-plus-overlay h2 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
        color: #111;
      }
      .snooze-plus-overlay label {
        display: block;
        font-size: 12px;
        color: #111;
        margin-bottom: 4px;
      }
      .snooze-plus-overlay input[type="number"] {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        color: #111;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        font-size: 14px;
      }
      .snooze-plus-hint {
        margin: 6px 0 12px;
        font-size: 11px;
        color: #111;
        opacity: 0.7;
      }
      .snooze-plus-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .snooze-plus-actions button {
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #fff;
        color: #111;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .snooze-plus-actions button.primary {
        background: #111;
        border-color: #111;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="chrome">
        <div class="label">Reminder</div>
        <div class="chrome-btns">
          <button type="button" id="btn-min" title="Minimize" aria-label="Minimize">─</button>
          <button type="button" class="close" id="btn-close" title="Close (ignore)" aria-label="Close">
            ✕
          </button>
        </div>
      </div>
      <div class="title" id="title">…</div>
      <div class="created" id="created"></div>
      <div class="notif-tags" id="tags"></div>
      <div class="details" id="details"></div>
      <div class="actions">
        <button type="button" class="secondary" id="btn-view">Edit</button>
        <button type="button" class="secondary" id="btn-snooze">Snooze</button>
        <button type="button" class="secondary" id="btn-snooze-plus">Snooze +</button>
        <button type="button" class="secondary" id="btn-delete" hidden>Delete</button>
        <button type="button" id="btn-done">Done</button>
      </div>
      <div id="snooze-plus-overlay" class="snooze-plus-overlay" hidden>
        <form id="snooze-plus-form">
          <h2 id="snooze-plus-title">Snooze for</h2>
          <label for="snooze-hours">Hours</label>
          <input
            type="number"
            id="snooze-hours"
            min="0.5"
            max="72"
            step="0.5"
            value="1"
            aria-labelledby="snooze-plus-title"
          />
          <p class="snooze-plus-hint">0.5 – 72</p>
          <div class="snooze-plus-actions">
            <button type="button" id="btn-snooze-plus-cancel">Cancel</button>
            <button type="submit" class="primary">Snooze</button>
          </div>
        </form>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const id = Number(params.get('id'));
      const rawItemType = params.get('itemType');
      // Preserve habit|bill|task|reminder (old ternary coerced habit/bill → reminder)
      const VALID = new Set([
        'reminder',
        'reminder_nudge',
        'task',
        'bill',
        'bill_nudge',
        'habit',
        'countdown',
      ]);
      const itemType = VALID.has(rawItemType) ? rawItemType : 'reminder';
      const payload = { id, itemType };
      const title = params.get('title') || 'Reminder';
      const label = params.get('label') || (itemType === 'task' ? 'Task' : 'Reminder');
      /** Query hex arrives without '#'. */
      function toHex(raw, fallback) {
        if (!raw) return fallback;
        return raw.charAt(0) === '#' ? raw : '#' + raw;
      }
      const bgColor = toHex(params.get('bgColor'), '#F4F1EA');
      const borderColor = toHex(params.get('borderColor'), '#4A5A6A');
      const textColor = toHex(params.get('textColor'), '#111111');
      const snoozeMins = Number(params.get('snoozeMins') || 10);

      document.querySelector('.label').textContent = label;
      document.getElementById('title').textContent = title;
      // Show #tag chips under title (e.g. #nudge on habit pre-reminders)
      const rawTags = (params.get('tags') || '')
        .split(',')
        .map((t) => t.trim())
        .filter(Boolean);
      document.getElementById('tags').textContent = rawTags
        .map((t) => (t.startsWith('#') ? t : '#' + t))
        .join(' ');
      const card = document.querySelector('.card');
      card.style.setProperty('--notif-bg', bgColor);
      card.style.setProperty('--notif-border', borderColor);
      card.style.setProperty('--notif-text', textColor);
      document.getElementById('btn-snooze').textContent = 'Snooze ' + snoozeMins + 'm';
      if (itemType === 'countdown') {
        document.getElementById('btn-snooze').hidden = true;
        document.getElementById('btn-snooze-plus').hidden = true;
        const del = document.getElementById('btn-delete');
        del.hidden = false;
        del.onclick = () => window.notifApi.delete(payload);
      }

      window.notifApi.getMeta().then((meta) => {
        const text = meta && meta.details ? String(meta.details).trim() : '';
        document.getElementById('details').textContent = text;
        const created = meta && meta.createdAt ? String(meta.createdAt).trim() : '';
        document.getElementById('created').textContent = created
          ? 'Created ' + created
          : '';
      }).catch(() => {});

      if (window.notifApi.onRefresh) {
        window.notifApi.onRefresh((payload) => {
          if (payload && payload.title != null) {
            document.getElementById('title').textContent = payload.title;
          }
          const text =
            payload && payload.details ? String(payload.details).trim() : '';
          document.getElementById('details').textContent = text;
          const created =
            payload && payload.createdAt ? String(payload.createdAt).trim() : '';
          document.getElementById('created').textContent = created
            ? 'Created ' + created
            : '';
        });
      }

      const overlay = document.getElementById('snooze-plus-overlay');
      const hoursInput = document.getElementById('snooze-hours');

      /** Clamp hours to 0.5–72 in 0.5 steps; return minutes or null. */
      function hoursToMinutes(raw) {
        if (raw === '' || raw == null) return null;
        const n = Number(raw);
        if (!Number.isFinite(n)) return null;
        const snapped = Math.round(n * 2) / 2;
        const hours = Math.min(72, Math.max(0.5, snapped));
        return Math.round(hours * 60);
      }

      function openSnoozePlus() {
        overlay.hidden = false;
        hoursInput.value = '1';
        requestAnimationFrame(() => hoursInput.focus());
      }

      function closeSnoozePlus() {
        overlay.hidden = true;
      }

      document.getElementById('btn-done').onclick = () => {
        window.notifApi.complete(payload);
      };
      document.getElementById('btn-snooze').onclick = () => {
        window.notifApi.snooze(payload, snoozeMins);
      };
      document.getElementById('btn-snooze-plus').onclick = openSnoozePlus;
      document.getElementById('btn-snooze-plus-cancel').onclick = closeSnoozePlus;
      document.getElementById('snooze-plus-form').onsubmit = (e) => {
        e.preventDefault();
        const minutes = hoursToMinutes(hoursInput.value);
        if (minutes == null) return;
        window.notifApi.snooze(payload, minutes);
      };
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape' || overlay.hidden) return;
        e.preventDefault();
        e.stopPropagation();
        closeSnoozePlus();
      });
      document.getElementById('btn-view').onclick = () => {
        window.notifApi.view(payload);
      };
      document.getElementById('btn-min').onclick = () => {
        window.notifApi.minimize(payload);
      };
      document.getElementById('btn-close').onclick = () => {
        window.notifApi.ignore(payload);
      };
    </script>
  </body>
</html>
