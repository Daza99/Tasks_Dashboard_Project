# Portable unpacked folder — copy whole dir to USB (blueprint §16)
appId: com.lumo.personal-dashboard
productName: Personal Dashboard
directories:
  output: release/portable
files:
  - dist/**/*
  - src/main/**/*
  - src/services/**/*
  - src/utils/**/*
  - package.json
extraResources:
  - from: src/services/db/schema.sql
    to: schema.sql
asarUnpack:
  - node_modules/better-sqlite3/**
  - "**/*.node"
extraMetadata:
  flavor: portable
win:
  target:
    - dir
  signAndEditExecutable: false
